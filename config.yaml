spec_version: 1
name: omnievo-scientific-director
description: Databricks Omnigent scientific director for adaptive GB1 directed evolution under a strict 96-assay budget.
instructions: AGENTS.md

executor:
  type: omnigent
  use_responses: false
  config:
    harness: openai-agents
  model: databricks-deepseek-v4-flash-0731
  auth:
    type: api_key
    api_key: ${OMNIEVO_DATABRICKS_TOKEN}
    base_url: ${OMNIEVO_DATABRICKS_BASE_URL}

interaction:
  conversational: true
  modalities:
    input: [text, file]
    output: [text]

# Register sys_os_read/write/edit/shell for orchestration artifacts while
# confining those tools to the staged agent workspace. The private GB1 oracle
# remains in an unmounted sibling directory and is reachable only via the lab.
os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: darwin_seatbelt
    write_paths:
      - .
    # Required for the narrow authenticated virtual-lab API on 127.0.0.1.
    # The raw oracle remains outside the sandbox's readable filesystem.
    allow_network: true
    cwd_allow_hidden: []
    cwd_hidden_scan_recursive: true
    cwd_hidden_scan_overflow: error

tools:
  agents:
    - literature-scientist
    - hypothesis-scientist
    - surrogate-modeler
    - exploration-specialist
    - exploitation-specialist
    - local-search-specialist
    - experiment-planner
    - scientific-critic
    - statistical-reviewer
    - demo-curator
  builtins:
    - web_search

policies:
  session_tool_cap:
    type: function
    handler: omnigent.policies.builtins.safety.max_tool_calls_per_session
    factory_params:
      limit: 500
