[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnievo"
version = "0.1.0"
description = "Omnigent-orchestrated adaptive directed evolution on the GB1 landscape"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8,<4", "scipy>=1.12,<2", "python-pptx>=1.0,<2"]
dev = ["pytest>=8,<9"]

[project.scripts]
omnievo = "omnievo.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
